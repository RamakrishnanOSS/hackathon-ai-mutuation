# ─────────────────────────────────────────────────────────────────────────────
# AI Mutation Testing — Dev Container Compose
#
# Only the devcontainer service lives here. Core services (core-service,
# prometheus, grafana) are managed by the root-level docker-compose.yml.
#
# The devcontainer joins "mutation-net" (created by the root compose) so it
# can reach core-service, prometheus, and grafana by service name.
# Run the infra stack first:
#   docker compose up -d   (from the project root)
# ─────────────────────────────────────────────────────────────────────────────
version: '3.8'

networks:
  mutation-net:
    external: true          # created by the root docker-compose.yml

services:

  # ── Dev container ──────────────────────────────────────────
  devcontainer:
    build:
      context: ..                    # project root as build context
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached         # live-mount project source
    networks:
      - mutation-net
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    # keep container alive; actual processes started by devcontainer lifecycle hooks
    command: /bin/sh -c "while sleep 3600; do :; done"
