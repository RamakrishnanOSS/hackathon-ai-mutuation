[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-mutation-testing-py"
version = "0.1.0"
description = "Python example project for AI-driven mutation testing"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "AI Mutation Testing Team"},
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "mutmut>=2.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--tb=short -v"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages]
find = {}

[tool.mutmut]
paths_to_mutate = "src"
tests_dir = "tests"
