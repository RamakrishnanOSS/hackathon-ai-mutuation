# ─────────────────────────────────────────────────────────────────────────────
# AI Mutation Testing — Core Service Stack
#
# Runs the FastAPI core mutation service only. Start with:
#   docker compose up -d
#
# Services:
#   core-service  – FastAPI mutation service (port 8000)
#
# Prometheus (9090) and Grafana (3000) are managed by the root project.
# This stack joins the shared mutation-net network to reach them.
# ─────────────────────────────────────────────────────────────────────────────
networks:
  mutation-net:
    external: true

services:

  # ── Core Mutation Service (FastAPI) ────────────────────────
  core-service:
    build:
      context: ..
      dockerfile: mutation-engine/Dockerfile.core
    volumes:
      - ../agent:/workspace:cached
      - ./services:/app/services:cached
      - ../project-sources:/project-sources:cached
    networks:
      - mutation-net
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

