# ─────────────────────────────────────────────────────────────────────────────
# AI Mutation Testing — Infrastructure Stack
#
# Runs independently of the devcontainer. Start with:
#   docker compose up -d
#
# Services:
#   core-service  – FastAPI mutation service (port 8000)
#   prometheus    – scrapes /metrics from core-service:8000 (port 9090)
#   grafana       – dashboards backed by Prometheus (port 3000)
#
# The devcontainer joins the "mutation-net" network (declared external there)
# so it can reach all services by name.
# ─────────────────────────────────────────────────────────────────────────────
networks:
  mutation-net:
    name: mutation-net
    driver: bridge

volumes:
  grafana-data:

services:

  # ── Core Mutation Service (FastAPI) ────────────────────────
  core-service:
    build:
      context: .
      dockerfile: Dockerfile.core
    container_name: core-service
    volumes:
      - ./:/workspace:cached
    networks:
      - mutation-net
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - MUTATION_WORKSPACE_DIR=/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Prometheus ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    networks:
      - mutation-net
    volumes:
      - ./services/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - core-service
    restart: unless-stopped

  # ── Grafana ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    networks:
      - mutation-net
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./services/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./services/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
