name: Build and Cache Docker Image

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'project-sources/.devcontainer/Dockerfile'
      - 'project-sources/.devcontainer/docker-compose.yml'
      - 'requirements.txt'
      - '.github/workflows/build-container.yml'
  workflow_dispatch:
  schedule:
    # Rebuild daily to keep cache fresh
    - cron: '0 0 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/mutation-testing

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=cache

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./project-sources/.devcontainer
          dockerfile: ./project-sources/.devcontainer/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,scope=${{ github.workflow }},mode=max

      - name: Image digest
        run: echo "Built image with digest: ${{ steps.meta.outputs.tags }}"
