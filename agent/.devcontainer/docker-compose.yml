# ─────────────────────────────────────────────────────────────────────────────
# AI Mutation Testing — Dev Container Compose (agent workspace)
#
# The devcontainer workspace is agent/ — the source directory consumed by
# the mutation engine. The core-service is built from Dockerfile.core.
#
# Services:
#   - devcontainer:   VS Code dev environment (Python 3.11, Node 20, build-essential)
#   - core-service:   FastAPI mutation service (built from Dockerfile.core)
#
# The devcontainer joins "mutation-net" so services can communicate by name.
# Both services share the same network and access to API keys via environment.
# ─────────────────────────────────────────────────────────────────────────────
networks:
  mutation-net:
    external: true

services:

  # ── Dev container ──────────────────────────────────────────
  devcontainer:
    build:
      context: ../..                 # project root as build context
      dockerfile: agent/.devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached         # live-mount agent/ as /workspace
    networks:
      - mutation-net
    depends_on:
      - core-service
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    # keep container alive; actual processes started by devcontainer lifecycle hooks
    command: /bin/sh -c "while sleep 3600; do :; done"

  # ── Core mutation service (from Dockerfile.core) ───────────
  core-service:
    build:
      context: ../..                 # project root as build context
      dockerfile: Dockerfile.core
    ports:
      - "8001:8000"
    networks:
      - mutation-net
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ..:/app:cached               # live-mount project root for hot-reload
    command: python3 services/core_mutation_service.py
